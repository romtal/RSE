<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mesure Écoconception</title>
<meta name="description" content="Outil de pilotage RGESN 2024 : auto-évaluation des 78 critères officiels, mesure d'empreinte carbone et génération de déclaration d'écoconception pour les marchés publics." />
<meta name="color-scheme" content="light dark" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#F2F5F1;
    --surface:#FFFFFF;
    --surface-2:#EAF0EA;
    --surface-3:#E1EAE3;
    --ink:#152420;
    --ink-soft:#516059;
    --ink-faint:#7C8981;
    --border:#DCE4DD;
    --border-strong:#C4D0C6;
    --accent:#1E6F52;
    --accent-strong:#134F39;
    --accent-soft:#DCEEE3;
    --info:#2F5F86;
    --info-soft:#DEEAF3;
    --warn:#9C6208;
    --warn-soft:#F5E7CF;
    --bad:#A5392C;
    --bad-soft:#F5DFDA;
    --na:#707A83;
    --na-soft:#E7E9EC;
    --shadow: 0 1px 2px rgba(21,36,32,0.06), 0 4px 14px rgba(21,36,32,0.06);
    --radius-s: 6px;
    --radius-m: 10px;
    --radius-l: 16px;
    --font-display:'IBM Plex Serif', Georgia, serif;
    --font-body:'IBM Plex Sans', -apple-system, Segoe UI, sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0F1512;
      --surface:#161F1A;
      --surface-2:#1C2620;
      --surface-3:#233028;
      --ink:#E7EEEA;
      --ink-soft:#AAB6AF;
      --ink-faint:#7E8B84;
      --border:#2A362E;
      --border-strong:#374439;
      --accent:#54BC90;
      --accent-strong:#7ED4AC;
      --accent-soft:#1B3A2C;
      --info:#8AB8DE;
      --info-soft:#1C2E3C;
      --warn:#E3A94B;
      --warn-soft:#3A2E17;
      --bad:#E2796A;
      --bad-soft:#3B211C;
      --na:#8E99A2;
      --na-soft:#232B31;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 14px rgba(0,0,0,0.25);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F1512;
    --surface:#161F1A;
    --surface-2:#1C2620;
    --surface-3:#233028;
    --ink:#E7EEEA;
    --ink-soft:#AAB6AF;
    --ink-faint:#7E8B84;
    --border:#2A362E;
    --border-strong:#374439;
    --accent:#54BC90;
    --accent-strong:#7ED4AC;
    --accent-soft:#1B3A2C;
    --info:#8AB8DE;
    --info-soft:#1C2E3C;
    --warn:#E3A94B;
    --warn-soft:#3A2E17;
    --bad:#E2796A;
    --bad-soft:#3B211C;
    --na:#8E99A2;
    --na-soft:#232B31;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 14px rgba(0,0,0,0.25);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:14.5px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:var(--font-display); font-weight:600; margin:0; text-wrap:balance;}
  .mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
  a{color:var(--info);}
  button{font-family:inherit;}
  ::selection{background:var(--accent-soft);}

  /* ---------- App shell ---------- */
  .app-bar{
    position:sticky; top:0; z-index:30;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    padding: calc(10px + env(safe-area-inset-top,0px)) 20px 10px;
  }
  .app-bar-row{
    max-width:1180px; margin:0 auto;
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:10px; margin-right:auto;}
  .brand-mark{
    width:34px; height:34px; border-radius:9px;
    background:linear-gradient(135deg, var(--accent), var(--accent-strong));
    display:flex; align-items:center; justify-content:center;
    color:#fff; flex-shrink:0;
  }
  .brand-text h1{font-size:17px; line-height:1.15;}
  .brand-text span{font-size:11.5px; color:var(--ink-faint); letter-spacing:.02em;}

  select, input[type=text], input[type=date], input[type=number], textarea{
    font-family:var(--font-body);
    font-size:13.5px;
    color:var(--ink);
    background:var(--surface);
    border:1px solid var(--border-strong);
    border-radius:var(--radius-s);
    padding:7px 10px;
  }
  textarea{font-family:var(--font-body); resize:vertical;}
  select:focus, input:focus, textarea:focus, button:focus-visible{
    outline:2px solid var(--accent); outline-offset:1px;
  }

  .service-picker{display:flex; align-items:center; gap:8px;}
  .service-picker select{min-width:190px; max-width:44vw;}

  .btn{
    display:inline-flex; align-items:center; gap:6px;
    border:1px solid var(--border-strong); background:var(--surface);
    color:var(--ink); border-radius:var(--radius-s);
    padding:7px 12px; font-size:13.5px; font-weight:500; cursor:pointer;
    white-space:nowrap;
  }
  .btn:hover{border-color:var(--accent); color:var(--accent-strong);}
  .btn-primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn-primary:hover{background:var(--accent-strong); border-color:var(--accent-strong); color:#fff;}
  .btn-ghost{border-color:transparent; background:transparent;}
  .btn-sm{padding:4px 9px; font-size:12.5px;}
  .btn-danger{color:var(--bad);}
  .btn:disabled{opacity:.5; cursor:not-allowed;}

  .score-pill{
    display:flex; align-items:center; gap:8px;
    background:var(--surface-2); border:1px solid var(--border);
    border-radius:999px; padding:5px 6px 5px 14px;
  }
  .score-pill .val{font-family:var(--font-mono); font-weight:600; font-size:16px;}
  .score-pill .ring{width:30px; height:30px; flex-shrink:0;}
  .score-pill .lbl{font-size:11px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.04em;}

  .tabs{
    max-width:1180px; margin:0 auto; display:flex; gap:2px;
    overflow-x:auto; padding-top:8px; scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab-btn{
    background:transparent; border:none; border-bottom:2.5px solid transparent;
    color:var(--ink-soft); padding:9px 13px 10px; font-size:13.5px; font-weight:500;
    cursor:pointer; white-space:nowrap; border-radius:6px 6px 0 0;
  }
  .tab-btn:hover{color:var(--ink); background:var(--surface-2);}
  .tab-btn.active{color:var(--accent-strong); border-bottom-color:var(--accent);}

  main{max-width:1180px; margin:0 auto; padding:22px 20px calc(60px + env(safe-area-inset-bottom,0px));}
  .panel{display:none;}
  .panel.active{display:block;}

  /* ---------- Cards / grid ---------- */
  .grid{display:grid; gap:14px;}
  .grid-kpi{grid-template-columns:repeat(4, minmax(0,1fr));}
  .grid-2{grid-template-columns:1.3fr 1fr;}
  @media (max-width:900px){ .grid-kpi{grid-template-columns:repeat(2,minmax(0,1fr));} .grid-2{grid-template-columns:1fr;} }
  @media (max-width:520px){ .grid-kpi{grid-template-columns:1fr 1fr;} }

  .card{
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-l); padding:16px 18px; box-shadow:var(--shadow);
  }
  .card h3{font-size:14px;}
  .card-head{display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:10px;}
  .card-head .hint{font-size:11.5px; color:var(--ink-faint);}

  .kpi{display:flex; flex-direction:column; gap:6px;}
  .kpi .k-label{font-size:11.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.03em;}
  .kpi .k-value{font-family:var(--font-mono); font-size:24px; font-weight:600; line-height:1.1;}
  .kpi .k-unit{font-size:12px; color:var(--ink-soft); font-weight:400;}
  .kpi .k-sub{font-size:11.5px; color:var(--ink-faint);}

  .empty{color:var(--ink-faint); font-size:13px; padding:10px 2px;}

  /* ---------- Badges / pills ---------- */
  .pill{
    display:inline-flex; align-items:center; gap:5px;
    border-radius:999px; padding:2.5px 9px; font-size:11.5px; font-weight:600;
    letter-spacing:.01em; white-space:nowrap;
  }
  .pill-dot{width:6px; height:6px; border-radius:50%; background:currentColor; flex-shrink:0;}
  .pill-prioritaire{background:var(--bad-soft); color:var(--bad);}
  .pill-recommande{background:var(--warn-soft); color:var(--warn);}
  .pill-modere{background:var(--na-soft); color:var(--na);}
  .pill-valide{background:var(--accent-soft); color:var(--accent-strong);}
  .pill-non_valide{background:var(--bad-soft); color:var(--bad);}
  .pill-a_evaluer{background:var(--warn-soft); color:var(--warn);}
  .pill-na{background:var(--na-soft); color:var(--na);}
  .pill-theme{background:var(--info-soft); color:var(--info);}

  /* ---------- Evaluation table ---------- */
  .theme-group{border:1px solid var(--border); border-radius:var(--radius-l); margin-bottom:12px; overflow:hidden; background:var(--surface);}
  .theme-head{
    display:flex; align-items:center; gap:12px; padding:12px 16px; cursor:pointer;
    background:var(--surface-2);
  }
  .theme-head:hover{background:var(--surface-3);}
  .theme-head h4{font-size:14.5px; flex:1;}
  .theme-head .chev{transition:transform .15s ease; color:var(--ink-faint);}
  .theme-group.open .theme-head .chev{transform:rotate(90deg);}
  .theme-bar{width:100px; height:6px; border-radius:99px; background:var(--surface-3); overflow:hidden; flex-shrink:0;}
  .theme-bar > div{height:100%; background:var(--accent);}
  .theme-score{font-family:var(--font-mono); font-size:12.5px; color:var(--ink-soft); width:42px; text-align:right; flex-shrink:0;}
  .theme-body{display:none;}
  .theme-group.open .theme-body{display:block;}

  .crit-row{border-top:1px solid var(--border); padding:10px 16px;}
  .crit-row-main{display:flex; flex-wrap:wrap; align-items:flex-start; gap:6px 10px; cursor:pointer;}
  .crit-id{font-family:var(--font-mono); font-size:12px; color:var(--ink-faint); width:34px; flex-shrink:0; padding-top:3px;}
  .crit-libelle{flex:1 1 220px; font-size:13.3px; min-width:0;}
  .crit-controls{display:flex; align-items:center; gap:6px; flex:1 1 auto; flex-wrap:wrap; justify-content:flex-end; min-width:0;}
  @media (max-width:520px){ .crit-controls{flex-basis:100%; justify-content:flex-start; padding-left:44px;} }
  .crit-detail{display:none; margin-top:10px; padding:12px 14px; background:var(--surface-2); border-radius:var(--radius-m); font-size:12.8px;}
  .crit-row.open .crit-detail{display:block;}
  .crit-row.open .crit-chev{transform:rotate(90deg);}
  .crit-chev{color:var(--ink-faint); transition:transform .15s ease; flex-shrink:0; margin-top:2px;}
  .crit-detail label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-faint); margin:10px 0 4px;}
  .crit-detail label:first-child{margin-top:0;}
  .crit-detail textarea, .crit-detail input{width:100%;}
  .field-row{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
  @media (max-width:640px){ .field-row{grid-template-columns:1fr 1fr;} }
  .moyen-test{background:var(--surface); border:1px dashed var(--border-strong); border-radius:var(--radius-s); padding:9px 11px; color:var(--ink-soft); font-size:12.5px; margin-bottom:10px;}

  select.st-select{font-weight:600; font-size:12px; padding:5px 8px;}
  select.st-a_evaluer{color:var(--warn);}
  select.st-valide{color:var(--accent-strong);}
  select.st-non_valide{color:var(--bad);}
  select.st-na{color:var(--na);}

  .filters{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; align-items:center;}
  .filters input[type=text]{min-width:180px; flex:1;}
  .filters select{flex-shrink:0;}
  .filters .count{font-size:12px; color:var(--ink-faint); margin-left:auto;}

  /* ---------- Table generic ---------- */
  table.simple{width:100%; border-collapse:collapse; font-size:13px;}
  table.simple th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-faint); font-weight:600; padding:6px 10px; border-bottom:1px solid var(--border);}
  table.simple td{padding:8px 10px; border-bottom:1px solid var(--border); vertical-align:top;}
  table.simple tr:last-child td{border-bottom:none;}
  .table-scroll{overflow-x:auto;}
  .table-scroll table.simple{min-width:640px;}

  /* ---------- Forms ---------- */
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px 16px;}
  @media (max-width:640px){ .form-grid{grid-template-columns:1fr;} }
  .form-field{display:flex; flex-direction:column; gap:5px;}
  .form-field.span2{grid-column:1/-1;}
  .form-field label{font-size:12px; font-weight:600; color:var(--ink-soft);}
  .form-field .help{font-size:11.3px; color:var(--ink-faint);}
  .form-field input, .form-field select, .form-field textarea{width:100%;}
  fieldset{border:1px solid var(--border); border-radius:var(--radius-m); padding:14px 16px; margin:0 0 16px;}
  fieldset legend{font-family:var(--font-display); font-weight:600; font-size:13.5px; padding:0 6px;}

  /* ---------- Modal ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(15,21,18,.45); z-index:100;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .modal{background:var(--surface); border-radius:var(--radius-l); padding:22px; max-width:480px; width:100%; box-shadow:var(--shadow); max-height:86vh; overflow:auto;}
  .modal h3{margin-bottom:4px;}
  .modal .actions{display:flex; justify-content:flex-end; gap:8px; margin-top:16px;}

  /* ---------- Declaration doc ---------- */
  .decl-doc{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-l); padding:30px clamp(18px,4vw,48px); font-family:var(--font-body);}
  .decl-doc h2{font-family:var(--font-display); font-size:20px; border-bottom:2px solid var(--accent); padding-bottom:8px; margin:26px 0 12px;}
  .decl-doc h2:first-child{margin-top:0;}
  .decl-doc h3{font-size:14.5px; margin:16px 0 6px; color:var(--accent-strong);}
  .decl-doc p{margin:0 0 10px;}
  .decl-doc ul{margin:6px 0 10px; padding-left:20px;}
  .decl-doc .crit-tag{font-family:var(--font-mono); font-size:11.5px; background:var(--accent-soft); color:var(--accent-strong); padding:1px 6px; border-radius:5px; margin-right:4px; display:inline-block;}
  .decl-doc .crit-tag.bad{background:var(--bad-soft); color:var(--bad);}
  .decl-doc .placeholder{color:var(--ink-faint); font-style:italic;}
  .decl-title-page{text-align:center; padding:30px 0 10px;}
  .decl-title-page h1{font-size:26px;}
  .decl-title-page .sub{color:var(--ink-soft); margin-top:6px;}

  /* ---------- Misc ---------- */
  .stack{display:flex; flex-direction:column; gap:14px;}
  .row-between{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .muted{color:var(--ink-faint);}
  .small{font-size:12px;}
  .divider{height:1px; background:var(--border); margin:14px 0;}
  .tag-list{display:flex; flex-wrap:wrap; gap:6px;}
  .copy-btn{margin-left:auto;}
  .banner{
    background:var(--info-soft); color:var(--info);
    border-radius:var(--radius-m); padding:11px 14px; font-size:12.8px; border:1px solid transparent;
    line-height:1.5;
  }
  .banner.warn{background:var(--warn-soft); color:var(--warn);}
  .banner strong{color:inherit;}
  .toast{
    position:fixed; bottom:calc(18px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--bg); padding:9px 16px; border-radius:99px; font-size:12.8px;
    z-index:200; opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

  svg text{font-family:var(--font-body); fill:var(--ink-soft);}
  .chart-wrap{overflow-x:auto;}

  @media print{
    .app-bar, .tabs, .no-print{display:none !important;}
    body{background:#fff;}
    main{max-width:none; padding:0;}
    .decl-doc{border:none; box-shadow:none; padding:0;}
  }
</style>
</head>
<body>


<div class="app-bar">
  <div class="app-bar-row">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M12 2C7 6 4 10.5 4 14.5A8 8 0 0 0 20 14.5C20 10.5 17 6 12 2Z" stroke="white" stroke-width="1.7" stroke-linejoin="round"/><path d="M12 14.5V21" stroke="white" stroke-width="1.7" stroke-linecap="round"/></svg>
      </div>
      <div class="brand-text">
        <h1>Mesure Écoconception</h1>
        <span id="brand-sub">RGESN 2024 · Docaposte VBU Secteur Public</span>
      </div>
    </div>
    <div class="service-picker no-print">
      <select id="service-select" aria-label="Projet évalué"></select>
      <button class="btn btn-sm" id="btn-new-service" title="Nouveau projet">+ Projet</button>
      <button class="btn btn-sm btn-ghost" id="btn-service-settings" title="Paramètres du projet">⚙︎</button>
    </div>
    <div class="score-pill" id="score-pill" title="Score d'avancement RGESN global">
      <svg class="ring" id="score-ring" viewBox="0 0 36 36"></svg>
      <div>
        <div class="lbl">Score</div>
        <div class="val" id="score-pill-val">–</div>
      </div>
    </div>
  </div>
  <nav class="tabs no-print" id="tabs">
    <button class="tab-btn active" data-tab="dashboard">Vue d'ensemble</button>
    <button class="tab-btn" data-tab="evaluation">Auto-évaluation RGESN</button>
    <button class="tab-btn" data-tab="mesure">Mesure technique</button>
    <button class="tab-btn" data-tab="declaration">Déclaration</button>
    <button class="tab-btn" data-tab="marches">Marchés publics</button>
  </nav>
</div>

<main>
  <div class="panel active" id="panel-dashboard"></div>
  <div class="panel" id="panel-evaluation"></div>
  <div class="panel" id="panel-mesure"></div>
  <div class="panel" id="panel-declaration"></div>
  <div class="panel" id="panel-marches"></div>
</main>

<div id="modal-root"></div>
<div class="toast" id="toast"></div>

<script src="/vercel-polyfill.js"></script>
<script src="/criteria-data.js"></script>
<script src="/cctp-data.js"></script>
<script src="/app.js"></script>
</body>
</html>
